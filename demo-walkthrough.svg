<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Pulsar 15-second interactive product walkthrough">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      @keyframes s1 { 0%, 30% { opacity: 1; } 33%, 97% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes s2 { 0%, 30% { opacity: 0; } 33%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }
      @keyframes s3 { 0%, 63% { opacity: 0; } 66%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes prog { 0% { width: 0; } 100% { width: 792px; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
      .scene1 { animation: s1 15s infinite; }
      .scene2 { animation: s2 15s infinite; }
      .scene3 { animation: s3 15s infinite; }
      .bar { animation: prog 15s linear infinite; }
      .dot { animation: pulse 1.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="880" height="420" rx="20" fill="url(#bg)"/>
  <!-- Header bar -->
  <rect x="24" y="20" width="832" height="44" rx="12" fill="#1E293B" stroke="#334155"/>
  <circle cx="48" cy="42" r="7" fill="#F59E0B"/>
  <text x="66" y="47" class="t" font-size="16" font-weight="800" fill="#F8FAFC">Pulsar v1.3 · Live 15-Second Walkthrough</text>
  <rect x="646" y="30" width="194" height="24" rx="12" fill="#064E3B"/>
  <circle cx="662" cy="42" r="4.5" fill="#34D399" class="dot"/>
  <text x="674" y="46" class="t" font-size="12" font-weight="700" fill="#A7F3D0">14-Day Free Trial · No Card</text>

  <!-- SCENE 1: Install & Pair -->
  <g class="scene1">
    <rect x="36" y="88" width="460" height="278" rx="14" fill="#111827" stroke="#334155"/>
    <text x="58" y="122" class="t" font-size="13" font-weight="700" fill="#F59E0B">STEP 1 OF 3 · ZERO-FRICTION PAIRING (0–5s)</text>
    <text x="58" y="152" class="t" font-size="22" font-weight="800" fill="#FFFFFF">Install in Antigravity &amp; scan QR</text>
    <text x="58" y="182" class="t" font-size="14" fill="#94A3B8">Every computer starts with an automatic 14-day free trial.</text>
    <text x="58" y="204" class="t" font-size="14" fill="#94A3B8">No credit card, no port forwarding, end-to-end encrypted.</text>
    <rect x="58" y="228" width="414" height="52" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="76" y="251" class="mono" font-size="13" fill="#38BDF8">Antigravity Extensions → Pulsar: AI Agent Remote</text>
    <text x="76" y="270" class="mono" font-size="12" fill="#34D399">✓ Host running · Free 14-day trial active · Relay connected</text>
    <rect x="58" y="296" width="188" height="44" rx="10" fill="url(#accent)"/>
    <text x="82" y="323" class="t" font-size="14" font-weight="800" fill="#FFFFFF">Pairing Code: K7M2-Q9XD</text>

    <!-- Phone mockup -->
    <rect x="540" y="84" width="300" height="286" rx="26" fill="#0B0F17" stroke="#475569" stroke-width="2"/>
    <text x="690" y="122" text-anchor="middle" class="t" font-size="15" font-weight="800" fill="#F8FAFC">Scan Pairing Code</text>
    <rect x="615" y="142" width="150" height="150" rx="14" fill="#FFFFFF"/>
    <rect x="633" y="160" width="36" height="36" rx="4" fill="#0F172A"/>
    <rect x="711" y="160" width="36" height="36" rx="4" fill="#0F172A"/>
    <rect x="633" y="238" width="36" height="36" rx="4" fill="#0F172A"/>
    <rect x="679" y="206" width="22" height="22" rx="3" fill="#EA580C"/>
    <rect x="711" y="238" width="36" height="36" rx="4" fill="#0F172A"/>
    <text x="690" y="324" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#34D399">🔒 E2EE Session Key Derived</text>
    <text x="690" y="346" text-anchor="middle" class="t" font-size="12" fill="#94A3B8">Works on Wi-Fi or 5G from anywhere</text>
  </g>

  <!-- SCENE 2: Live steps + Biometric approval -->
  <g class="scene2">
    <rect x="36" y="88" width="460" height="278" rx="14" fill="#111827" stroke="#334155"/>
    <text x="58" y="122" class="t" font-size="13" font-weight="700" fill="#F59E0B">STEP 2 OF 3 · LIVE CONTROL &amp; APPROVALS (5–10s)</text>
    <text x="58" y="152" class="t" font-size="22" font-weight="800" fill="#FFFFFF">Approve commands with Face ID</text>
    <text x="58" y="182" class="t" font-size="14" fill="#94A3B8">Watch Antigravity, Codex, and Claude Code edit files live.</text>
    <text x="58" y="204" class="t" font-size="14" fill="#94A3B8">Get 1 notification on completion or when a command waits.</text>
    <rect x="58" y="228" width="414" height="112" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="76" y="256" class="mono" font-size="13" fill="#F8FAFC">● Step 4 · Editing apps/api/checkout.ts (+18 -4)</text>
    <text x="76" y="282" class="mono" font-size="13" fill="#FBBF24">⚠ Approval needed: npm test &amp;&amp; npm run build</text>
    <text x="76" y="310" class="mono" font-size="12" fill="#34D399">✓ Approved via Biometrics · All 73 tests passed</text>

    <!-- Phone mockup -->
    <rect x="540" y="84" width="300" height="286" rx="26" fill="#0B0F17" stroke="#475569" stroke-width="2"/>
    <text x="564" y="120" class="t" font-size="14" font-weight="800" fill="#F8FAFC">Robins-MacBook-Pro · Remote</text>
    <rect x="560" y="138" width="260" height="148" rx="14" fill="#1E293B" stroke="#F59E0B"/>
    <text x="576" y="164" class="t" font-size="12" font-weight="800" fill="#FBBF24">COMMAND APPROVAL · MODERATE</text>
    <text x="576" y="192" class="mono" font-size="13" fill="#F8FAFC">npm test &amp;&amp; npm run build</text>
    <rect x="576" y="224" width="108" height="42" rx="10" fill="#334155"/>
    <text x="630" y="250" text-anchor="middle" class="t" font-size="14" font-weight="800" fill="#FCA5A5">Deny</text>
    <rect x="696" y="224" width="108" height="42" rx="10" fill="#16A34A"/>
    <text x="750" y="250" text-anchor="middle" class="t" font-size="14" font-weight="800" fill="#FFFFFF">Allow ✓</text>
    <text x="690" y="330" text-anchor="middle" class="t" font-size="12" fill="#94A3B8">Face ID / Fingerprint · 3x auto-PIN fallback</text>
  </g>

  <!-- SCENE 3: Screenshot paste, queue follow-up, Git diff -->
  <g class="scene3">
    <rect x="36" y="88" width="460" height="278" rx="14" fill="#111827" stroke="#334155"/>
    <text x="58" y="122" class="t" font-size="13" font-weight="700" fill="#F59E0B">STEP 3 OF 3 · SCREENSHOTS, QUEUE &amp; GIT (10–15s)</text>
    <text x="58" y="152" class="t" font-size="22" font-weight="800" fill="#FFFFFF">1-tap screenshot paste &amp; Git diffs</text>
    <text x="58" y="182" class="t" font-size="14" fill="#94A3B8">Paste screenshots straight from your keyboard or Mac/PC.</text>
    <text x="58" y="204" class="t" font-size="14" fill="#94A3B8">Queue follow-ups while the agent works; review diffs &amp; push.</text>
    <rect x="58" y="228" width="414" height="112" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="76" y="256" class="t" font-size="13" font-weight="700" fill="#38BDF8">📸 Screenshot ready — Tap to paste (Phone / Mac / PC)</text>
    <text x="76" y="284" class="t" font-size="13" font-weight="700" fill="#FBBF24">⏳ Follow-up queued — sends automatically on idle</text>
    <text x="76" y="312" class="mono" font-size="12" fill="#34D399">+ Commit &amp; Push · Revert Hunk · Localhost Preview</text>

    <!-- Phone mockup -->
    <rect x="540" y="84" width="300" height="286" rx="26" fill="#0B0F17" stroke="#475569" stroke-width="2"/>
    <text x="564" y="120" class="t" font-size="14" font-weight="800" fill="#F8FAFC">Chat · Changes · Preview</text>
    <rect x="560" y="138" width="260" height="58" rx="12" fill="#1E293B" stroke="#38BDF8"/>
    <text x="576" y="163" class="t" font-size="13" font-weight="800" fill="#F8FAFC">📸 Screenshot ready</text>
    <text x="576" y="182" class="t" font-size="12" fill="#94A3B8">Tap Paste on keyboard or banner</text>
    <rect x="560" y="208" width="260" height="52" rx="12" fill="#064E3B"/>
    <text x="576" y="230" class="mono" font-size="12" fill="#A7F3D0">+ 3 files changed · 1-tap Commit</text>
    <text x="576" y="248" class="mono" font-size="11" fill="#6EE7B7">localhost:3000 live preview ready</text>
    <rect x="560" y="274" width="260" height="40" rx="10" fill="#1E293B"/>
    <text x="576" y="299" class="t" font-size="13" fill="#94A3B8">Queue a follow-up…  📋 Paste  ↑</text>
  </g>

  <!-- Progress bar -->
  <rect x="44" y="388" width="792" height="6" rx="3" fill="#334155"/>
  <rect x="44" y="388" width="0" height="6" rx="3" fill="url(#accent)" class="bar"/>
</svg>
